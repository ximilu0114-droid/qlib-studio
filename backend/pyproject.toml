[project]
name = "qlib-studio"
version = "0.2.0a0"
description = "A local web-based research workbench for Microsoft Qlib"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy>=2.0.0,<3.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
]

[project.optional-dependencies]
mlflow = [
    "mlflow==3.11.1",
    "mlflow-skinny==3.11.1",
]
qlib = [
    "pyqlib==0.9.7",
]
rdagent = [
    "rdagent==0.8.0",
    "litellm==1.83.14",
    "click==8.1.8",
    "openai==2.24.0",
]
dev = [
    "httpx>=0.27.0,<1.0",
    "pytest>=8.0.0,<10.0",
    "pytest-asyncio>=0.24.0,<2.0",
    "ruff>=0.12.0,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
